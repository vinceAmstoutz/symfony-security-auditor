# $schema: https://raw.githubusercontent.com/vinceamstoutz/symfony-security-auditor/main/resources/schema.json

symfony_security_auditor:
    attacker_model: 'claude-opus-5'
    reviewer_model: 'claude-haiku-5-5'
    audit:
        fail_on: high
        min_confidence: 0.6
        tools_enabled: true
    cache:
        enabled: true
