<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="generator" content="{{packageName}}" />
    <title>Security Findings Trend — {{reportCount}} reports</title>
    <style>
      :root {
        color-scheme: light dark;
        --brand-pink: #e71c55;
        --brand-navy: #242d5c;
        --brand-muted: #6b7280;
        --brand-band: #f5f6fb;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --brand-navy: #5b6fd6;
          --brand-muted: #9ca3af;
          --brand-band: #1b1e2b;
        }
      }
      body {
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        line-height: 1.5;
        margin: 0;
      }
      a {
        color: var(--brand-pink);
      }
      header.brand {
        background: var(--brand-band);
        border-bottom: 3px solid var(--brand-pink);
      }
      header.brand > div,
      main {
        margin: 0 auto;
        max-width: 60rem;
        padding: 1.25rem 1rem;
      }
      .wordmark {
        font-size: 1.35rem;
        font-weight: 800;
        letter-spacing: 0.02em;
        line-height: 1.2;
        margin: 0;
      }
      .wordmark-lead {
        color: var(--brand-pink);
        font-weight: 700;
      }
      .wordmark-tail {
        color: var(--brand-navy);
        font-weight: 700;
      }
      .tagline {
        margin: 0.1rem 0 0;
      }
      .tagline a {
        color: var(--brand-muted);
        font-size: 0.85rem;
        text-decoration: none;
      }
      h1 {
        color: var(--brand-navy);
        margin-bottom: 0.25rem;
      }
      figure.chart {
        margin: 1.5rem 0;
      }
      figure.chart svg {
        height: auto;
        max-width: 100%;
      }
      figure.chart figcaption {
        color: var(--brand-muted);
        font-size: 0.85rem;
      }
      .line {
        fill: none;
        stroke: var(--brand-navy);
        stroke-width: 2;
      }
      .area {
        fill: var(--brand-navy);
        fill-opacity: 0.12;
      }
      .marker {
        fill: var(--brand-pink);
      }
      .axis,
      .grid {
        stroke: #8884;
        stroke-width: 1;
      }
      .tick {
        fill: var(--brand-muted);
        font-size: 10px;
      }
      .value {
        fill: currentColor;
        font-size: 11px;
        font-weight: 600;
      }
      table.trend {
        border-collapse: collapse;
        margin: 1rem 0;
      }
      table.trend th,
      table.trend td {
        border: 1px solid #8884;
        padding: 0.25rem 0.75rem;
        text-align: left;
      }
      table.trend thead th {
        background: var(--brand-navy);
        border-color: var(--brand-navy);
        color: #fff;
      }
      footer {
        border-top: 1px solid #8884;
        color: var(--brand-muted);
        margin-top: 2rem;
      }
    </style>
  </head>
  <body>
    <header class="brand">
      <div>
        <p class="wordmark"><span class="wordmark-lead">◉ &gt;&gt; SECURITY</span> <span class="wordmark-tail">AUDITOR</span></p>
        <p class="tagline">Symfony - multi-agent LLM audit<br /><a href="{{packageUrl}}">{{packageUrl}}</a></p>
      </div>
    </header>
    <main>
      <h1>Security Findings Trend</h1>
      <p>{{summary}}</p>
      <figure class="chart">
        {{chart}}
        <figcaption>Validated finding totals per report, oldest to newest.</figcaption>
      </figure>
      <table class="trend">
        <caption>
          Reports, oldest to newest
        </caption>
        <thead>
          <tr>
            <th>#</th>
            <th>Report</th>
            <th>Total</th>
            <th>New</th>
            <th>Fixed</th>
            <th>Unverified</th>
          </tr>
        </thead>
        <tbody>
          {{rows}}
        </tbody>
      </table>
      <footer>
        <p><small>Generated by <span class="wordmark-lead">SECURITY</span> <span class="wordmark-tail">AUDITOR</span> · <a href="{{packageUrl}}">{{packageName}}</a>.</small></p>
      </footer>
    </main>
  </body>
</html>
