deptrac:
  paths:
    - ./src
  layers:
    - name: Domain
      collectors:
        - type: directory
          value: src/Audit/Domain/.*
    - name: Application
      collectors:
        - type: directory
          value: src/Audit/Application/.*
    - name: SymfonyProfile
      collectors:
        - type: directory
          value: src/Audit/Infrastructure/Prompt/.*
        - type: classLike
          value: .*\\Infrastructure\\Scan\\(IsGrantedAttributeParser|PhpParserControllerAccessControlParser|PhpParserFormBindingParser|PhpParserVoterCapabilityParser|RouteAttributeParser|SymfonyYamlSecurityConfigParser)$
        - type: classLike
          value: .*\\Infrastructure\\Config\\(AttackerAgentDefinitionFactory|AuditConfigurationDefinition|ContainerParameterRegistrar)$
    - name: Infrastructure
      collectors:
        - type: bool
          must:
            - type: directory
              value: src/Audit/Infrastructure/.*
          must_not:
            - type: layer
              value: SymfonyProfile
    - name: Command
      collectors:
        - type: directory
          value: src/Command/.*
    - name: Bundle
      collectors:
        - type: classLike
          value: VinceAmstoutz\\SymfonySecurityAuditor\\SymfonySecurityAuditorBundle
    - name: Standalone
      collectors:
        - type: directory
          value: src/Standalone/.*
  ruleset:
    Domain: ~
    Application:
      - Domain
    Infrastructure:
      - Domain
      - Application
    SymfonyProfile:
      - Domain
      - Application
      - Infrastructure
    Command:
      - Application
      - Domain
      - Infrastructure
      - SymfonyProfile
    Bundle:
      - Application
      - Domain
      - Infrastructure
      - SymfonyProfile
      - Command
    Standalone:
      - Bundle
      - Application
      - Domain
      - Infrastructure
      - SymfonyProfile
      - Command
