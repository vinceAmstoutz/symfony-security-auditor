deptrac:
  paths:
    - ./packages/core/src
    - ./src
  layers:
    - name: Domain
      collectors:
        - type: directory
          value: packages/core/src/Audit/Domain/.*
    - name: Application
      collectors:
        - type: directory
          value: packages/core/src/Audit/Application/.*
    - name: Infrastructure
      collectors:
        - type: directory
          value: packages/core/src/Audit/Infrastructure/.*
    - name: Command
      collectors:
        - type: directory
          value: packages/core/src/Command/.*
    - name: SymfonyProfile
      collectors:
        - type: bool
          must:
            - type: directory
              value: src/Audit/Infrastructure/.*
          must_not:
            - type: directory
              value: packages/core/src/.*
    - name: Bundle
      collectors:
        - type: classLike
          value: VinceAmstoutz\\SymfonySecurityAuditor\\SymfonySecurityAuditorBundle
    - name: Standalone
      collectors:
        - type: directory
          value: src/Standalone/.*
  ruleset:
    Domain: ~
    Application:
      - Domain
    Infrastructure:
      - Domain
      - Application
    Command:
      - Application
      - Domain
      - Infrastructure
    SymfonyProfile:
      - Domain
      - Application
      - Infrastructure
      - Command
    Bundle:
      - Application
      - Domain
      - Infrastructure
      - SymfonyProfile
      - Command
    Standalone:
      - Bundle
      - Application
      - Domain
      - Infrastructure
      - SymfonyProfile
      - Command
