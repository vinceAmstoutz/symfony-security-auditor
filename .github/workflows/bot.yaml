name: Bot

on:
  workflow_dispatch:
    inputs:
      action:
        description: What the bot posts
        required: true
        type: choice
        options:
          - create-issue
          - comment
      number:
        description: Issue or pull request to comment on (comment only)
        required: false
        type: string
      title:
        description: Issue title (create-issue only)
        required: false
        type: string
      body:
        description: Markdown body of the issue or comment
        required: true
        type: string
      labels:
        description: Comma-separated labels (create-issue only)
        required: false
        type: string

permissions: {}

jobs:
  post:
    name: Post as the bot
    if: github.actor == github.repository_owner
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Create the bot token
        id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.BOT_CLIENT_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
          permission-issues: write

      - name: Create the issue
        if: inputs.action == 'create-issue'
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          TITLE: ${{ inputs.title }}
          BODY: ${{ inputs.body }}
          LABELS: ${{ inputs.labels }}
        run: |
          test -n "$TITLE" || { echo '::error::create-issue needs a title'; exit 1; }
          set -- --title "$TITLE" --body "$BODY"
          if [ -n "$LABELS" ]; then set -- "$@" --label "$LABELS"; fi
          gh issue create "$@" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Comment on the issue or pull request
        if: inputs.action == 'comment'
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          NUMBER: ${{ inputs.number }}
          BODY: ${{ inputs.body }}
        run: |
          case "$NUMBER" in ''|*[!0-9]*) echo '::error::comment needs a numeric issue or pull request number'; exit 1;; esac
          gh issue comment "$NUMBER" --body "$BODY" | tee -a "$GITHUB_STEP_SUMMARY"
