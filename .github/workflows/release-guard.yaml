name: Release Guard

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

jobs:
  verify-version-pins:
    name: Version pins match the tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify the changelog and every pin release ${{ github.ref_name }}
        env:
          TAG: ${{ github.ref_name }}
        run: sh .github/scripts/release.sh check "$TAG"
