name: Auto Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description:
          "Version to tag and release (X.Y.Z) — replays a release the push
          trigger missed, e.g. because this workflow did not exist yet on main"
        required: true
        type: string
      publish:
        description:
          "Publish the release immediately instead of leaving it as a draft.
          Rarely needed — normally review the drafted release notes and publish
          manually in the GitHub UI."
        required: false
        type: boolean
        default: false

permissions: {}

jobs:
  detect:
    name: Detect a release commit
    if:
      "${{ github.event_name == 'workflow_dispatch' ||
      startsWith(github.event.head_commit.message, 'chore: release ') }}"
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      version: ${{ steps.parse.outputs.version }}
    steps:
      - name: Parse the version from the commit message
        id: parse
        env:
          # Passed through the environment rather than interpolated into the
          # script: a push to main is trusted, but this still avoids the
          # habit of splicing ${{ }} expressions into shell code.
          MESSAGE: ${{ github.event.head_commit.message }}
          MANUAL_VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail

          if [ -n "$MANUAL_VERSION" ]; then
            version="$MANUAL_VERSION"
          else
            version="$(printf '%s\n' "$MESSAGE" | head -n1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -n1)"
          fi
          if [ -z "$version" ]; then
            echo "::error::Could not determine a X.Y.Z version. Expected a workflow_dispatch \"version\" input or a \"chore: release X.Y.Z\" commit message."
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Checkout code
        if: github.event_name == 'push'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify the release commit is a genuine merge of 1.x
        if: github.event_name == 'push'
        run: |
          set -euo pipefail

          # A push-triggered release commit is always meant to be the `chore:
          # release X.Y.Z` merge of `<N>.x` into `main` — a regular merge
          # commit with two parents (main's previous tip, then `<N>.x`'s tip).
          # Squash- or rebase-merging that PR instead replays `<N>.x`'s
          # commits under fresh SHAs, permanently duplicating them across both
          # branches — exactly what happened in #305. Catch it here rather
          # than let it land silently.
          parents=($(git rev-list --parents -n1 HEAD))
          if [ "${#parents[@]}" -ne 3 ]; then
            echo "::error::This release commit has $(( ${#parents[@]} - 1 )) parent(s), expected 2 (a regular merge commit). Squash- or rebase-merging the release PR duplicates <N>.x's commits under new SHAs instead of sharing history with main — see docs/versioning.md#branches--maintenance. Re-open and merge it with a regular merge commit."
            exit 1
          fi

          second_parent="${parents[2]}"
          git fetch origin 1.x --quiet
          if ! git merge-base --is-ancestor "$second_parent" origin/1.x; then
            echo "::error::This release commit's second parent ($second_parent) is not part of 1.x's history, so it doesn't look like a genuine 1.x-into-main merge — see docs/versioning.md#branches--maintenance."
            exit 1
          fi

  tag-and-draft-release:
    name: Tag the release and draft its GitHub Release
    needs: detect
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Build the What's Changed release notes
        id: notes
        env:
          VERSION: ${{ needs.detect.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          previous_tag="$(git tag --list --sort=-version:refname '[0-9]*.[0-9]*.[0-9]*' | grep -vxF "$VERSION" | head -n1 || true)"
          if [ -z "$previous_tag" ]; then
            echo "::error::Could not find a previous release tag to diff against."
            exit 1
          fi

          {
            echo "## What's Changed"
            echo
          } > release-notes.md

          git log --reverse --format='%H %s' "${previous_tag}..HEAD" | while IFS=' ' read -r sha rest; do
            pr_number="$(printf '%s\n' "$rest" | grep -oE '\(#[0-9]+\)$' | tr -d '(#)' || true)"
            [ -z "$pr_number" ] && continue

            description="$(printf '%s\n' "$rest" | sed -E 's/[[:space:]]*\(#[0-9]+\)$//')"

            author_login="$(gh pr view "$pr_number" --repo "$REPO" --json author --jq '.author.login' 2>/dev/null || true)"
            [ -z "$author_login" ] && author_login="vinceAmstoutz"

            printf -- '- %s by @%s in https://github.com/%s/pull/%s\n' "$description" "$author_login" "$REPO" "$pr_number" >> release-notes.md
          done

          {
            echo
            printf '**Full Changelog**: https://github.com/%s/compare/%s...%s\n' "$REPO" "$previous_tag" "$VERSION"
          } >> release-notes.md

      - name: Create and push the tag
        env:
          VERSION: ${{ needs.detect.outputs.version }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git rev-parse "$VERSION" >/dev/null 2>&1; then
            echo "Tag $VERSION already exists, skipping creation."
          else
            git tag "$VERSION"
            git push origin "$VERSION"
          fi

      - name: Resolve the release name from the changelog codename
        id: release-name
        env:
          VERSION: ${{ needs.detect.outputs.version }}
        run: |
          set -euo pipefail

          codename="$(grep -m1 "^## \[$VERSION\]" CHANGELOG.md | sed -E 's/^## \[[^]]+\] — [0-9-]+ — //')"
          if [ -n "$codename" ]; then
            echo "name=$VERSION - $codename" >> "$GITHUB_OUTPUT"
          else
            echo "name=$VERSION" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve whether to publish immediately
        id: publish-state
        env:
          PUBLISH: ${{ github.event.inputs.publish }}
        run: |
          set -euo pipefail

          if [ "$PUBLISH" = "true" ]; then
            echo "draft=false" >> "$GITHUB_OUTPUT"
          else
            echo "draft=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Draft the GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # zizmor: ignore[superfluous-actions] v3.0.2 -- not a security issue per zizmor's own docs; migrating to `gh release` is a separate follow-up
        with:
          tag_name: ${{ needs.detect.outputs.version }}
          name: ${{ steps.release-name.outputs.name }}
          body_path: release-notes.md
          draft: ${{ steps.publish-state.outputs.draft }}

      - name: Trigger the binary build for a release this workflow published
        if: steps.publish-state.outputs.draft == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          VERSION: ${{ needs.detect.outputs.version }}
        run: |
          set -euo pipefail

          # release.yaml listens for `release: published`, but an event
          # produced by the default GITHUB_TOKEN never cascades into another
          # workflow run (GitHub's anti-recursion guard) -- only a human
          # publishing through the UI triggers it that way. Dispatch it
          # explicitly instead; an API-triggered workflow_dispatch is not
          # subject to that restriction.
          gh workflow run release.yaml --repo "$REPO" --field tag="$VERSION"
