name: CI

on:
  push:
    branches:
      - main
      - "[0-9]+.x"
  pull_request: ~
  workflow_dispatch: ~

permissions:
  contents: read

concurrency:
  # A newer push to the same branch supersedes the run of the commit before it; pull request and manual runs are never cancelled.
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

env:
  # Pin the root package version instead of letting Composer guess it. The guess
  # depends on the checked-out branch name and on tags being present, neither of
  # which holds on a depth-1 detached-HEAD checkout, and
  # staabm/phpstan-todo-by's todoBy.sfDeprecation reports every
  # trigger_deprecation() whose since-version the root version satisfies — so a
  # guess above 1.13 fails PHPStan, and Infection with it. Must stay below the
  # oldest not-yet-removed deprecation; see docs/versioning.md.
  COMPOSER_ROOT_VERSION: 1.0.x-dev

jobs:
  prettier:
    name: Prettier Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Run Prettier check MD files
        run: npx --yes prettier@3.6.2 --check "**/*.md"

  markdown-lint:
    name: Markdown Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run markdownlint-cli2
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0
        with:
          config: .markdownlint-cli2.jsonc
          globs: '**/*.md'

  commit-lint:
    name: Commit Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run commitlint
        uses: wagoid/commitlint-github-action@b948419dd99f3fd78a6548d48f94e3df7f6bf3ed # v6.2.1

      - name: Lint the PR title (becomes the squash-merge commit message)
        if: github.event_name == 'pull_request'
        env:
          # Passed through the environment rather than interpolated into the
          # script: a PR title is attacker-controlled on a fork PR, so
          # splicing it into a ${{ }} expression inside shell code would be a
          # template-injection command-execution vector.
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail
          printf '%s\n' "$PR_TITLE" | npx --yes --package @commitlint/cli@21.2.1 --package @commitlint/config-conventional@21.2.0 -- commitlint --config commitlint.config.mjs

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.3'
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: vendor
          key: composer-lint-${{ hashFiles('composer.lock') }}
          restore-keys: composer-lint-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Assert the resolved root version stays below the oldest deprecation
        run: |
          php -r '
            require "vendor/autoload.php";
            $package = "vinceamstoutz/symfony-security-auditor";
            $oldest = "1.13";
            $ranges = Composer\InstalledVersions::getVersionRanges($package);
            $satisfies = Composer\InstalledVersions::satisfies(new Composer\Semver\VersionParser(), $package, ">=" . $oldest);
            printf("root version ranges: %s\n", $ranges);
            printf("satisfies >=%s: %s\n", $oldest, $satisfies ? "yes" : "no");
            if ($satisfies) {
              fwrite(STDERR, sprintf(
                "::error::The resolved root version (%s) is at or above %s, so todoBy.sfDeprecation will report every trigger_deprecation() introduced in %s. Set COMPOSER_ROOT_VERSION below it, or remove those deprecations. See docs/versioning.md.\n",
                $ranges, $oldest, $oldest
              ));
              exit(1);
            }
          '

      - name: Cache Rector result cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: var/rector
          key: rector-${{ hashFiles('src/**/*.php', 'tests/**/*.php', 'rector.php', 'composer.lock') }}
          restore-keys: rector-

      - name: Cache PHP CS Fixer result cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .php-cs-fixer.cache
          key: php-cs-fixer-${{ hashFiles('src/**/*.php', 'tests/**/*.php', '.php-cs-fixer.dist.php', 'composer.lock') }}
          restore-keys: php-cs-fixer-

      - name: Normalize composer.json
        run: composer normalize --dry-run

      - name: PHP CS Fixer
        run: vendor/bin/php-cs-fixer fix --config .php-cs-fixer.dist.php --dry-run --diff

      - name: Rector
        run: vendor/bin/rector process --dry-run

      - name: PHPStan
        run: vendor/bin/phpstan analyse --memory-limit=500M

      - name: Deptrac
        run: vendor/bin/deptrac analyse --no-progress

      - name: Swiss Knife
        run: |
          vendor/bin/swiss-knife check-commented-code src tests tools
          vendor/bin/swiss-knife check-conflicts src tests tools

      - name: Composer audit
        run: composer audit

      - name: Install script tests
        run: sh tests/Shell/install_script_test.sh

      - name: Pull request check tests
        run: sh tests/Shell/pull_request_check_test.sh

  zizmor:
    name: zizmor (GitHub Actions security scan)
    runs-on: ubuntu-latest
    permissions:
      security-events: write # required for zizmor-action's SARIF upload to Code Scanning
      contents: read
      actions: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4

  tests:
    name: Tests + Mutation (PHP ${{ matrix.php }}, Symfony ${{ matrix.symfony }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
        # Symfony 8.0 is end of life and Composer refuses its releases for their open security advisories.
        symfony: ['7.4', '8.1']
        exclude:
          # Symfony 8 requires PHP 8.4.
          - php: '8.3'
            symfony: '8.1'
    env:
      SYMFONY_REQUIRE: ${{ matrix.symfony }}.*
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          coverage: pcov
          # symfony/flex makes `composer update` honour SYMFONY_REQUIRE, which pins the leg's Symfony version.
          tools: flex

      - name: Cache Composer dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: vendor
          key: composer-php${{ matrix.php }}-sf${{ matrix.symfony }}-${{ hashFiles('composer.json') }}
          restore-keys: composer-php${{ matrix.php }}-sf${{ matrix.symfony }}-

      - name: Install dependencies
        run: composer update --no-interaction --prefer-dist --no-progress

      - name: Cache PHPUnit result cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .phpunit.cache
          key: phpunit-php${{ matrix.php }}-sf${{ matrix.symfony }}-${{ hashFiles('src/**/*.php', 'tests/**/*.php', 'phpunit.xml', 'composer.json') }}
          restore-keys: phpunit-php${{ matrix.php }}-sf${{ matrix.symfony }}-

      - name: Run test suite with coverage (enforces 100% via MinimumLineCoverageExtension)
        run: |
          bin/phpunit \
            --coverage-clover=build/coverage/clover.xml \
            --coverage-xml=build/coverage/coverage-xml \
            --log-junit=build/coverage/junit.xml \

      - name: Upload coverage to Codecov
        if: matrix.php == '8.3' && matrix.symfony == '7.4'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: build/coverage/clover.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      - name: Run Infection mutation tests
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          INFECTION_DASHBOARD_API_KEY: ${{ secrets.INFECTION_DASHBOARD_API_KEY }}
        run: |
          ARGS="--configuration=infection.json5 --threads=max --coverage=build/coverage --skip-initial-tests --min-msi=100 --min-covered-msi=100"
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            git fetch --depth=1 origin "$BASE_REF"
            ARGS="$ARGS --git-diff-lines --git-diff-base=origin/$BASE_REF --ignore-msi-with-no-mutations"
          fi
          php -d memory_limit=4G bin/infection $ARGS

      - name: Show the escaped and timed-out mutants
        if: failure()
        run: |
          if [ -f infection/infection.log ]; then
            sed -n '/^Escaped mutants:$/,/^Skipped mutants:$/p' infection/infection.log | head -n 2000
          fi

      - name: Upload Infection logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: infection-logs-php${{ matrix.php }}-symfony${{ matrix.symfony }}
          path: infection/
          if-no-files-found: ignore
          retention-days: 7

  compat:
    name: Compatibility (with the last release)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.3'
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: vendor
          key: composer-compat-${{ hashFiles('composer.json') }}
          restore-keys: composer-compat-

      - name: Install dependencies
        run: composer update --no-interaction --prefer-dist --no-progress

      - name: Compare with the fixtures recorded from the last release
        run: vendor/bin/phpunit -c phpunit.compat.xml

  api-bc:
    name: API compatibility (roave/backward-compatibility-check)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.3'
          extensions: bcmath, intl
          coverage: none

      - name: Install roave/backward-compatibility-check
        run: composer install --working-dir=tools/bc-check --no-interaction --prefer-dist --no-progress

      - name: Find the last release of the line this change is headed for
        id: release
        env:
          BASE_BRANCH: ${{ github.base_ref || github.ref_name }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          # A release branch names its line; a stacked pull request names it with the release branch ticked in its description, else the release branch it is closest to.
          line=''
          case "$BASE_BRANCH" in
            [0-9]*.x) line="${BASE_BRANCH%.x}" ;;
            main) ;;
            *)
              line="$(printf '%s\n' "${PR_BODY:-}" | tr -d '\r' | sed -n 's/^- \[[xX]\] `\([0-9][0-9]*\)\.x`.*/\1/p' | head -n 1)"
              if [ -z "$line" ]; then
                closest=''
                for branch in $(git for-each-ref --format='%(refname:lstrip=3)' refs/remotes/origin/); do
                  case "$branch" in [0-9]*.x) ;; *) continue ;; esac
                  ahead="$(git rev-list --count "origin/$branch..HEAD")"
                  if [ -z "$closest" ] || [ "$ahead" -lt "$closest" ]; then
                    closest="$ahead"
                    line="${branch%.x}"
                  fi
                done
              fi
              ;;
          esac
          if [ -n "$line" ]; then pattern="$line.*.*"; else pattern='*.*.*'; fi
          tag="$(git tag --list "$pattern" --sort=-v:refname | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1 || true)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [ -z "$tag" ]; then
            echo "::notice::No release of ${line:+line $line.x}${line:-any line} yet: there is no public API to compare with."
          fi

      - name: Compare the public API with that release
        if: steps.release.outputs.tag != ''
        env:
          LAST_RELEASE: ${{ steps.release.outputs.tag }}
        run: var/bc-check/vendor/bin/roave-backward-compatibility-check --from="$LAST_RELEASE" --format=github-actions
