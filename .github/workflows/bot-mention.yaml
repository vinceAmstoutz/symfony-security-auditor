name: Bot mention

on:
  pull_request_review_comment:
    types: [created]

permissions: {}

jobs:
  mention:
    name: Hand the mention to the bot
    if: github.event.comment.user.login == github.repository_owner && github.event.pull_request.head.repo.full_name == github.repository && (contains(github.event.comment.body, '/bot') || contains(github.event.comment.body, '@vinceamstoutz-github-ai-bot'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Keep only a /bot command or a mention of the bot
        id: request
        env:
          BODY: ${{ github.event.comment.body }}
        run: |
          if printf '%s\n' "$BODY" | grep -Eq '(^|[[:space:]])/bot([[:space:]]|$)' || printf '%s\n' "$BODY" | grep -Fiq '@vinceamstoutz-github-ai-bot'; then
            echo "asked=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Start the bot's mentions workflow for this comment
        if: steps.request.outputs.asked == 'true'
        env:
          GH_TOKEN: ${{ secrets.BOT_DISPATCH_TOKEN }}
          REPOSITORY: ${{ github.event.repository.name }}
          COMMENT_ID: ${{ github.event.comment.id }}
        run: gh workflow run mentions.yaml -R vinceAmstoutz/vince-bot -f repository="$REPOSITORY" -f comment_id="$COMMENT_ID" -f comment_type=review
