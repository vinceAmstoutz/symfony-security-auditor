name: Bot mention

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions: {}

jobs:
  mention:
    name: Hand the mention to the bot
    if: github.event.comment.user.login == github.repository_owner && (contains(github.event.comment.body, '/bot') || contains(github.event.comment.body, '@vinceamstoutz-github-ai-bot'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Start the bot's mentions workflow for this comment
        env:
          GH_TOKEN: ${{ secrets.BOT_DISPATCH_TOKEN }}
          REPOSITORY: ${{ github.event.repository.name }}
          COMMENT_ID: ${{ github.event.comment.id }}
          COMMENT_TYPE: ${{ github.event_name == 'pull_request_review_comment' && 'review' || 'issue' }}
        run: gh workflow run mentions.yaml -R vinceAmstoutz/vince-bot -f repository="$REPOSITORY" -f comment_id="$COMMENT_ID" -f comment_type="$COMMENT_TYPE"
