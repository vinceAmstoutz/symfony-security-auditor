version: 2

updates:
  - package-ecosystem: composer
    directory: /
    target-branch: "1.x"
    schedule:
      interval: daily
    cooldown:
      default-days: 7
    groups:
      symfony:
        patterns:
          - symfony/*

  - package-ecosystem: github-actions
    directory: /
    target-branch: "1.x"
    schedule:
      interval: daily
    cooldown:
      default-days: 7
